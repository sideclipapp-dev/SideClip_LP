    <script>
      var COOKIE_CONSENT_BANNER_ENABLED = true;
      var COOKIE_CONSENT_KEY = 'sideclip_cookie_consent_v1';
      var savedCookieConsent = null;
      try {
        savedCookieConsent = localStorage.getItem(COOKIE_CONSENT_KEY);
      } catch (_) {
        /* Continue with denied analytics when storage is unavailable. */
      }
      var defaultAnalyticsConsent = savedCookieConsent === 'accepted' ? 'granted' : 'denied';

      window.dataLayer = window.dataLayer || [];
      function gtag() {dataLayer.push(arguments);}

      gtag('consent', 'default', {
        analytics_storage: defaultAnalyticsConsent,
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        wait_for_update: 500
      });
      gtag('js', new Date());

      var initialSiteLanguage = window.location.pathname === '/en' || window.location.pathname.indexOf('/en/') === 0
        ? 'en'
        : 'ja';

      gtag('set', { site_language: initialSiteLanguage });
      gtag('set', 'user_properties', { site_language: initialSiteLanguage });
      gtag('config', 'G-D3JVLNHHMQ', { site_language: initialSiteLanguage });

  <body data-i18n-page="landing">
    <div id="root"></div>
    <div
      id="cookie-banner"
      class="cookie-banner"
      role="dialog"
      aria-live="polite"
      aria-label="Cookie consent banner"
      hidden
    >
      <div class="cookie-banner__inner">
      <p class="cookie-banner__text">
        We use analytics cookies to improve this site.
      </p>
      <div class="cookie-banner__actions">
        <button
          id="cookie-accept"
          class="cookie-banner__button cookie-banner__button--primary"
          type="button"
        >
          Accept
        </button>
        <button
          id="cookie-reject"
          class="cookie-banner__button cookie-banner__button--secondary"
          type="button"
        >
          Decline
        </button>
      </div>
      </div>
    </div>
    <script>
      (function() {
        if (!COOKIE_CONSENT_BANNER_ENABLED) return;

        var CONSENT_KEY = COOKIE_CONSENT_KEY;
        var banner = document.getElementById('cookie-banner');
        if (banner) banner.removeAttribute('hidden');
        var acceptButton = document.getElementById('cookie-accept');
        var rejectButton = document.getElementById('cookie-reject');

        function applyConsent(granted) {
          if (typeof gtag !== 'function') return;
          gtag('consent', 'update', {
            analytics_storage: granted ? 'granted' : 'denied',
            ad_storage: 'denied',
            ad_user_data: 'denied',
            ad_personalization: 'denied'
          });
        }

        function trackConsentChoice(status) {
          if (typeof gtag !== 'function') return;
          window.setTimeout(function() {
            gtag('event', 'consent_choice', {
              consent_status: status,
              consent_method: 'banner',
              page_path: location.pathname,
              transport_type: 'beacon'
            });
          }, 350);
        }

        function hideBanner() {
          if (banner) banner.classList.remove('is-visible');
        }

        function showBanner() {
          if (banner) banner.classList.add('is-visible');
        }

        var savedChoice = savedCookieConsent;
        if (savedChoice === 'accepted') {
          applyConsent(true);
          hideBanner();
        } else if (savedChoice === 'rejected') {
          applyConsent(false);
          hideBanner();
        } else {
          showBanner();
        }

        if (acceptButton) {
          acceptButton.addEventListener('click', function() {
            try {
              localStorage.setItem(CONSENT_KEY, 'accepted');
            } catch (_) {
              /* Keep the accepted state for this page when storage is unavailable. */
            }
            applyConsent(true);
            trackConsentChoice('accepted');
            if (typeof gtag === 'function') {
              gtag('event', 'page_view', {
                page_location: location.href,
                page_path: location.pathname,
                page_title: document.title
              });
            }
            hideBanner();
          });
        }

        if (rejectButton) {
          rejectButton.addEventListener('click', function() {
            try {
              localStorage.setItem(CONSENT_KEY, 'rejected');
            } catch (_) {
              /* Keep the rejected state for this page when storage is unavailable. */
            }
            applyConsent(false);
            trackConsentChoice('rejected');
            hideBanner();
          });
        }
      })();
    </script>
